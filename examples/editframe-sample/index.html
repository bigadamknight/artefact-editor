<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editframe sample (static)</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; }
      ef-timegroup { display: block; }
      ef-text { display: block; }
      .stage { width: 1920px; height: 1080px; background: #000; position: relative; overflow: hidden; }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 80px; box-sizing: border-box; }
      .headline { color: #f8fafc; font-size: 96px; font-weight: 800; letter-spacing: -2px; text-align: center; }
      .subtitle { color: #94a3b8; font-size: 36px; font-weight: 400; text-align: center; max-width: 1200px; }
    </style>
  </head>
  <body>
    <ef-timegroup workbench mode="sequence" class="stage">
      <ef-timegroup mode="fixed" duration="5s" class="scene">
        <ef-text data-edit-id="blk_headline" duration="5s" class="headline">
          Editframe artefacts, edited live.
        </ef-text>
        <ef-text data-edit-id="blk_subtitle" duration="5s" class="subtitle">
          artefact-editor sits above any HTML video framework — Editframe, HyperFrames, plain CSS — and edits the source directly.
        </ef-text>
      </ef-timegroup>
    </ef-timegroup>
  </body>
</html>
